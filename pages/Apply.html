<body>

<header>
    <div>
        <div class="logo-en">LINKORA</div>
        <div class="logo-ar">من الجامعة إلى سوق العمل</div>
    </div>

    <nav>
        <a href="../index.html">الرئيسية</a>
        <a href="./Opportunities.html">الفرص</a>
        <a href="./Company-register.html">الشركات</a>
        <a href="./Login.html">تسجيل الدخول</a>
    </nav>
</header>

<main class="page">
    <div id="content">
        <div class="message">جاري تحميل بيانات التقديم...</div>
    </div>
</main>

<footer>
    © 2026 <span>LINKORA</span> — من الجامعة إلى سوق العمل
</footer>

<script>
    const content = document.getElementById("content");
    const params = new URLSearchParams(window.location.search);

    const opportunityId = params.get("id");
    const studentEmail = localStorage.getItem("userEmail");

    let opportunityData = null;
    let studentData = null;
    let isSubmitting = false;

    async function loadData() {
        try {
            if (!opportunityId) {
                throw new Error("لم يتم تحديد الفرصة.");
            }

            if (!studentEmail) {
                content.innerHTML = `
                    <div class="card">
                        <div class="message">
                            <h2>سجّلي الدخول أولًا</h2>
                            <p>يلزم تسجيل الدخول بحساب الطالب قبل التقديم.</p>
                            <a class="back" href="./Login.html">
                                الانتقال إلى تسجيل الدخول ←
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            const opportunityResponse = await fetch(
                `/opportunity?id=${encodeURIComponent(opportunityId)}`
            );

            if (!opportunityResponse.ok) {
                throw new Error("تعذر تحميل بيانات الفرصة.");
            }

            opportunityData = await opportunityResponse.json();

            const profileResponse = await fetch(
                `/profile?email=${encodeURIComponent(studentEmail)}`
            );

            if (!profileResponse.ok) {
                throw new Error("تعذر تحميل بيانات الطالب.");
            }

            const profileData = await profileResponse.json();
            studentData = profileData.user || profileData;

            renderPage();

        } catch (error) {
            console.error(error);

            content.innerHTML = `
                <div class="card">
                    <div class="message">
                        <h2>تعذر تحميل البيانات</h2>
                        <p>تأكدي من تسجيل الدخول وأن الفرصة موجودة.</p>
                        <a class="back" href="./Opportunities.html">
                            العودة إلى الفرص ←
                        </a>
                    </div>
                </div>
            `;
        }
    }

    function renderPage() {
        content.innerHTML = `
            <div class="title">
                <div class="label">APPLICATION</div>
                <h1>تأكيد التقديم</h1>
                <p>راجعي بياناتك قبل إرسال طلب التقديم إلى جهة العمل.</p>
            </div>

            <div class="card">
                <div class="opportunity-box">
                    <div class="label">الفرصة التي اخترتيها</div>
                    <h2 id="opportunityTitle"></h2>
                </div>

                <h3 class="student-heading">بيانات الطالب</h3>

                <div class="student-info">
                    <div class="info">
                        <strong>الاسم</strong>
                        <span id="studentName"></span>
                    </div>

                    <div class="info">
                        <strong>البريد الإلكتروني</strong>
                        <span id="studentEmail"></span>
                    </div>
                </div>

                <div class="notice">
                    <strong>تنبيه:</strong>
                    عند تأكيد التقديم، سيتم إرسال طلبك إلى جهة العمل.
                    يمكنك متابعة حالة الطلب من لوحة الطالب.
                </div>

                <button type="button" id="applyButton">
                    تأكيد التقديم
                </button>

                <div id="result" aria-live="polite"></div>

                <a class="back" href="./Opportunities.html">
                    ← العودة إلى الفرص
                </a>
            </div>
        `;

        // استخدام textContent لحماية النصوص القادمة من السيرفر
        document.getElementById("opportunityTitle").textContent =
            opportunityData.title || "فرصة غير محددة";

        document.getElementById("studentName").textContent =
            studentData.name || "غير متوفر";

        document.getElementById("studentEmail").textContent =
            studentData.email || studentEmail;

        document.getElementById("applyButton").addEventListener(
            "click",
            submitApplication
        );
    }

    async function submitApplication() {
        if (isSubmitting) return;

        const button = document.getElementById("applyButton");
        const result = document.getElementById("result");

        isSubmitting = true;
        button.disabled = true;
        button.textContent = "جاري إرسال الطلب...";
        result.textContent = "";
        result.className = "";

        try {
            const response = await fetch("/apply", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userEmail: studentEmail,
                    opportunityId: opportunityId,
                    opportunityName: opportunityData.title
                })
            });

            const data = await response.json();

            if (!response.ok) {
                result.textContent =
                    data.message || "حدث خطأ أثناء التقديم.";
                result.className = "error";
                return;
            }

            result.innerHTML = `
                <div class="success">
                    تم التقديم على الفرصة بنجاح!
                    <small>يمكنك متابعة حالة طلبك من لوحة الطالب.</small>
                </div>
            `;

            button.style.display = "none";

        } catch (error) {
            console.error(error);

            result.textContent = "تعذر الاتصال بالسيرفر. حاولي مرة أخرى.";
            result.className = "error";

        } finally {
            isSubmitting = false;

            if (button.style.display !== "none") {
                button.disabled = false;
                button.textContent = "تأكيد التقديم";
            }
        }
    }

    loadData();
</script>

</body>
</html>
