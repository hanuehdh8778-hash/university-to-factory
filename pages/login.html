
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F1F8FC">

    <title>تسجيل الدخول | LINKORA</title>

    <style>
        :root {
            --blue: #1769AA;
            --baby-blue: #A7D8F0;
            --sky-blue: #70C5E8;
            --navy: #123B5D;
            --background: #F1F8FC;
            --text: #52697A;
            --white: #FFFFFF;
            --border: #DCEAF3;
            --success: #16845B;
            --error: #C83D4D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: var(--background);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
        }

        header {
            background: var(--white);
            padding: 17px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 3px 15px rgba(18, 59, 93, 0.04);
        }

        .brand {
            flex-shrink: 0;
        }

        .logo-en {
            color: var(--blue);
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo-ar {
            color: var(--text);
            font-size: 12px;
            margin-top: 4px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--navy);
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: var(--blue);
        }

        .page {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(167, 216, 240, 0.32),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(112, 197, 232, 0.20),
                    transparent 28%
                ),
                var(--background);
        }

        .login-card {
            width: min(470px, 100%);
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 18px 55px rgba(18, 59, 93, 0.10);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E5F5FC;
            border-radius: 18px;
            color: var(--blue);
            font-size: 30px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .label {
            color: var(--blue);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: var(--navy);
        }

        .title p {
            color: var(--text);
            font-size: 14px;
            line-height: 1.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--navy);
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: #FAFCFE;
            color: var(--navy);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }

        input::placeholder {
            color: #98AAB8;
        }

        input:focus {
            border-color: var(--blue);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.09);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: var(--blue);
            color: var(--white);
            font-size: 15px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 5px;
        }

        button:hover {
            background: var(--navy);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(23, 105, 170, 0.18);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 17px;
            color: var(--blue);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            line-height: 1.8;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .register {
            text-align: center;
            margin-top: 24px;
            color: var(--text);
            font-size: 14px;
        }

        .register a {
            color: var(--blue);
            font-weight: 800;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 19px;
            color: var(--text);
            font-size: 13px;
        }

        .back:hover {
            color: var(--blue);
        }

        .reset-box {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .reset-title {
            text-align: center;
            color: var(--blue);
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .cancel {
            background: var(--white);
            color: var(--text);
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .cancel:hover {
            background: var(--background);
            color: var(--navy);
            box-shadow: none;
            transform: none;
        }

        footer {
            text-align: center;
            padding: 22px 15px;
            color: var(--text);
            background: var(--white);
            border-top: 1px solid var(--border);
            font-size: 13px;
        }

        footer span {
            color: var(--blue);
            font-weight: 800;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                padding: 18px 5%;
                gap: 15px;
            }

            nav {
                justify-content: center;
                gap: 13px 18px;
            }

            nav a {
                font-size: 13px;
            }

            .page {
                padding: 30px 15px;
            }

            .login-card {
                padding: 28px 22px;
            }

            .title h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a class="brand" href="../index.html">
            <div class="logo-en">LINKORA</div>
            <div class="logo-ar">من الجامعة إلى سوق العمل</div>
        </a>

        <nav>
            <a href="../index.html">الرئيسية</a>
            <a href="./Opportunities.html">الفرص</a>
            <a href="./Student-register.html">أنا طالب</a>
            <a href="./Company-register.html">الشركات</a>
            <a href="./Login.html" class="active">تسجيل الدخول</a>
        </nav>
    </header>

    <main class="page">

        <section class="login-card">

            <div class="icon-box" aria-hidden="true">↗</div>

            <div class="title">
                <div class="label">WELCOME BACK TO LINKORA</div>
                <p>سجّل دخولك وتابع فرصك وتقديماتك وخطوتك الجاية في سوق العمل.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    تسجيل الدخول
                </button>

            </form>

            <a class="forgot" id="forgotPassword" href="#resetBox">
                نسيت كلمة المرور؟
            </a>

            <div class="reset-box" id="resetBox">

                <div class="reset-title">تغيير كلمة المرور</div>

                <div class="form-group">
                    <label for="resetEmail">البريد الإلكتروني</label>
                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="example@email.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">كلمة المرور الجديدة</label>
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="6 أحرف أو أرقام على الأقل"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="أعد كتابة كلمة المرور"
                        autocomplete="new-password"
                    >
                </div>

                <button type="button" id="resetButton">
                    تغيير كلمة المرور
                </button>

                <button type="button" class="cancel" id="cancelReset">
                    إلغاء
                </button>

            </div>

            <div id="message" class="message" role="status" aria-live="polite"></div>

            <div class="register">
                ليس لديك حساب؟
                <a href="./Student-register.html">إنشاء حساب طالب</a>
            </div>

            <a class="back" href="../index.html">← العودة للرئيسية</a>

        </section>

    </main>

    <footer>
        © 2026 <span>LINKORA</span> — من الجامعة إلى سوق العمل
    </footer>

    <script>
        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, type = "error") {
            message.style.color = type === "success"
                ? "#16845B"
                : "#C83D4D";

            message.textContent = text;
        }

        /* تسجيل الدخول */
        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            button.disabled = true;
            button.textContent = "جاري تسجيل الدخول...";
            message.textContent = "";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.message || "بيانات الدخول غير صحيحة");
                    return;
                }

                const userData = {
                    name: data.user?.name || data.name || "",
                    email: data.user?.email || data.email || email
                };

                localStorage.setItem("user", JSON.stringify(userData));
                localStorage.setItem("userEmail", userData.email);
                localStorage.setItem("student", JSON.stringify(userData));
                localStorage.setItem("userData", JSON.stringify(userData));

                showMessage("تم تسجيل الدخول بنجاح", "success");

                setTimeout(function () {
                    window.location.href = "./Student-dashboard.html";
                }, 700);

            } catch (error) {
                console.error(error);
                showMessage("حصلت مشكلة في الاتصال بالسيرفر. تأكد إن السيرفر شغال.");
            } finally {
                button.disabled = false;
                button.textContent = "تسجيل الدخول";
            }
        });

        /* إظهار نموذج تغيير كلمة المرور */
        const forgotPassword = document.getElementById("forgotPassword");
        const resetBox = document.getElementById("resetBox");
        const cancelReset = document.getElementById("cancelReset");

        forgotPassword.addEventListener("click", function (event) {
            event.preventDefault();

            resetBox.style.display = "block";

            document.getElementById("resetEmail").value =
                document.getElementById("email").value.trim();

            message.textContent = "";

            resetBox.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        });

        cancelReset.addEventListener("click", function () {
            resetBox.style.display = "none";
            message.textContent = "";
        });

        /* تغيير كلمة المرور */
        const resetButton = document.getElementById("resetButton");

        resetButton.addEventListener("click", async function () {
            const email = document.getElementById("resetEmail").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!email || !newPassword || !confirmPassword) {
                showMessage("من فضلك املأ جميع البيانات");
                return;
            }

            if (newPassword.length < 6) {
                showMessage("كلمة المرور لازم تكون 6 أحرف أو أرقام على الأقل");
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage("كلمتا المرور غير متطابقتين");
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "جاري تغيير كلمة المرور...";
            message.textContent = "";

            try {
                const response = await fetch("/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.message || "تعذر تغيير كلمة المرور");
                    return;
                }

                showMessage(
                    "تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.",
                    "success"
                );

                document.getElementById("email").value = email;
                document.getElementById("password").value = newPassword;

                document.getElementById("newPassword").value = "";
                document.getElementById("confirmPassword").value = "";

                resetBox.style.display = "none";

            } catch (error) {
                console.error(error);
                showMessage("حصلت مشكلة في الاتصال بالسيرفر.");
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "تغيير كلمة المرور";
            }
        });
    </script>

</body>
</html>
