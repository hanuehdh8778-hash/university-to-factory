<body>

<header>
    <div class="logo">FROM UNIVERSITY TO FACTORY</div>
    <a href="./Student-dashboard.html">العودة للوحة الطالب</a>
</header>

<div class="container">

    <div class="card">

        <h1>تعديل بياناتي</h1>

        <p class="subtitle">
            يمكنك تعديل اسمك والبريد الإلكتروني
        </p>

        <form id="profileForm">

            <label>الاسم</label>
            <input
                type="text"
                id="name"
                placeholder="اكتب اسمك"
                required
            >

            <label>البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                placeholder="اكتب البريد الإلكتروني"
                required
            >

            <button type="submit">
                💾 حفظ التعديلات
            </button>

        </form>

        <div id="message"></div>

        <a class="back" href="./Student-dashboard.html">
            ← العودة للوحة الطالب
        </a>

    </div>

</div>

<script>

const oldEmail = localStorage.getItem("userEmail");

if (!oldEmail) {
    window.location.href = "./Login.html";
}

// تحميل البيانات الحالية
fetch(`/profile?email=${encodeURIComponent(oldEmail)}`)
    .then(response => response.json())
    .then(data => {

        if (data && !data.error) {
            document.getElementById("name").value = data.name || "";
            document.getElementById("email").value = data.email || oldEmail;
        }

    })
    .catch(error => {
        console.error(error);
    });


// حفظ التعديلات
document.getElementById("profileForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();

    if (!name || !email) {
        showMessage("من فضلك املئي كل البيانات", false);
        return;
    }

    try {

        const response = await fetch("/update-profile", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                oldEmail: oldEmail,
                name: name,
                email: email
            })
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "حدث خطأ", false);
            return;
        }

        // تحديث البريد في المتصفح
        localStorage.setItem("userEmail", email);

        const user = JSON.parse(localStorage.getItem("user") || "{}");
        user.name = name;
        user.email = email;
        localStorage.setItem("user", JSON.stringify(user));

        showMessage("✅ تم حفظ التعديلات بنجاح", true);

    } catch (error) {

        console.error(error);
        showMessage("حدث خطأ في الاتصال بالسيرفر", false);

    }

});


function showMessage(text, success) {

    const message = document.getElementById("message");

    message.textContent = text;
    message.style.color = success ? "#4caf50" : "#ff6b6b";

}

</script>

</body>
</html>
