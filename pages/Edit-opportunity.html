<body>

<header>
    <div class="logo">
        LINKORA
        <span>من الجامعة إلى سوق العمل</span>
    </div>

    <a href="./Company-dashboard.html" class="back">
        لوحة التحكم
    </a>
</header>

<main class="container">

    <div class="page-heading">
        <h1>إدارة الفرص</h1>
        <p class="subtitle">
            تابعي الفرص المنشورة من شركتك، وعدّلي بياناتها أو احذفيها عند الحاجة.
        </p>
    </div>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div id="opportunities">
        <div class="empty">
            <div class="empty-icon">↻</div>
            جاري تحميل الفرص...
        </div>
    </div>

</main>

<script>
    const companyEmail = localStorage.getItem("companyEmail");

    const container = document.getElementById("opportunities");
    const message = document.getElementById("message");

    let messageTimer;

    if (!companyEmail) {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">!</div>
                لا يوجد حساب شركة مسجل حاليًا.
                <br>
                سجّلي الدخول أولًا لمتابعة إدارة الفرص.
            </div>
        `;
    } else {
        loadOpportunities();
    }

    async function loadOpportunities() {
        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">↻</div>
                جاري تحميل الفرص...
            </div>
        `;

        try {
            const response = await fetch(
                `/company-opportunities?email=${encodeURIComponent(companyEmail)}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "تعذر تحميل الفرص.");
            }

            const opportunities = Array.isArray(data)
                ? data
                : (data.opportunities || []);

            if (opportunities.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">＋</div>
                        <strong>لسه مفيش فرص منشورة</strong>
                        <br>
                        تقدري تضيفي فرصة جديدة من لوحة تحكم الشركة.
                    </div>
                `;
                return;
            }

            container.innerHTML = "";

            opportunities.forEach(opportunity => {
                const card = document.createElement("article");
                card.className = "card";

                const title = document.createElement("h2");
                title.textContent = opportunity.title || "بدون عنوان";
                card.appendChild(title);

                const info = document.createElement("div");
                info.className = "info";

                const details = [
                    ["النوع", opportunity.type],
                    ["المجال", opportunity.field],
                    ["الموقع", opportunity.location],
                    ["آخر موعد للتقديم", opportunity.deadline]
                ];

                details.forEach(([labelText, value]) => {
                    const line = document.createElement("div");
                    const strong = document.createElement("strong");

                    strong.textContent = labelText + ": ";
                    line.appendChild(strong);
                    line.appendChild(document.createTextNode(value || "غير محدد"));

                    info.appendChild(line);
                });

                card.appendChild(info);

                const buttons = document.createElement("div");
                buttons.className = "buttons";

                const editButton = document.createElement("button");
                editButton.className = "edit-btn";
                editButton.textContent = "تعديل الفرصة";
                editButton.addEventListener("click", () => {
                    showEditForm(opportunity.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "حذف الفرصة";
                deleteButton.addEventListener("click", () => {
                    deleteOpportunity(opportunity.id, deleteButton);
                });

                buttons.append(editButton, deleteButton);
                card.appendChild(buttons);

                const editForm = createEditForm(opportunity);
                card.appendChild(editForm);

                container.appendChild(card);
            });

        } catch (error) {
            console.error(error);

            container.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">!</div>
                    تعذر تحميل الفرص حاليًا.
                    <br>
                    ${escapeHtml(error.message || "حاولي مرة أخرى لاحقًا.")}
                </div>
            `;
        }
    }

    function createEditForm(opportunity) {
        const id = opportunity.id;
        const form = document.createElement("div");

        form.className = "form";
        form.id = `form-${id}`;

        const heading = document.createElement("h3");
        heading.textContent = "تعديل بيانات الفرصة";
        form.appendChild(heading);

        addInput(form, "عنوان الفرصة", `title-${id}`, opportunity.title);
        addSelect(form, "نوع الفرصة", `type-${id}`, [
            { value: "تدريب", label: "تدريب" },
            { value: "وظيفة", label: "وظيفة" },
            { value: "تدريب صيفي", label: "تدريب صيفي" }
        ], opportunity.type);

        addInput(form, "المجال", `field-${id}`, opportunity.field);

        addInput(form, "الموقع", `location-${id}`, opportunity.location);

        addInput(
            form,
            "آخر موعد للتقديم",
            `deadline-${id}`,
            opportunity.deadline,
            "date"
        );

        addTextarea(
            form,
            "وصف الفرصة",
            `description-${id}`,
            opportunity.description
        );

        addInput(
            form,
            "المهارات المطلوبة",
            `skills-${id}`,
            opportunity.skills
        );

        const saveButton = document.createElement("button");
        saveButton.className = "save-btn";
        saveButton.textContent = "حفظ التعديلات";
        saveButton.addEventListener("click", () => {
            saveOpportunity(id, saveButton);
        });

        const cancelButton = document.createElement("button");
        cancelButton.className = "cancel-btn";
        cancelButton.textContent = "إلغاء";
        cancelButton.addEventListener("click", () => {
            hideEditForm(id);
        });

        form.append(saveButton, cancelButton);

        return form;
    }

    function addInput(parent, labelText, id, value, type = "text") {
        const label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = labelText;

        const input = document.createElement("input");
        input.id = id;
        input.type = type;
        input.value = value || "";

        parent.append(label, input);
    }

    function addTextarea(parent, labelText, id, value) {
        const label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = labelText;

        const textarea = document.createElement("textarea");
        textarea.id = id;
        textarea.value = value || "";

        parent.append(label, textarea);
    }

    function addSelect(parent, labelText, id, options, selectedValue) {
        const label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = labelText;

        const select = document.createElement("select");
        select.id = id;

        options.forEach(optionData => {
            const option = document.createElement("option");
            option.value = optionData.value;
            option.textContent = optionData.label;
            select.appendChild(option);
        });

        if (selectedValue && !options.some(item => item.value === selectedValue)) {
            const option = document.createElement("option");
            option.value = selectedValue;
            option.textContent = selectedValue;
            select.appendChild(option);
        }

        select.value = selectedValue || options[0].value;

        parent.append(label, select);
    }

    function showEditForm(id) {
        const form = document.getElementById(`form-${id}`);

        if (!form) return;

        form.style.display = "block";

        form.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }

    function hideEditForm(id) {
        const form = document.getElementById(`form-${id}`);

        if (form) {
            form.style.display = "none";
        }
    }

    async function saveOpportunity(id, button) {
        const updatedOpportunity = {
            companyEmail,
            title: document.getElementById(`title-${id}`).value.trim(),
            type: document.getElementById(`type-${id}`).value,
            field: document.getElementById(`field-${id}`).value.trim(),
            location: document.getElementById(`location-${id}`).value.trim(),
            deadline: document.getElementById(`deadline-${id}`).value,
            description: document.getElementById(`description-${id}`).value.trim(),
            skills: document.getElementById(`skills-${id}`).value.trim()
        };

        if (!updatedOpportunity.title) {
            showMessage("اكتبي عنوان الفرصة أولًا.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "جاري الحفظ...";

        try {
            const response = await fetch(`/opportunity/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedOpportunity)
            });

            const data = await response.json();

            if (!response.ok) {
                showMessage(
                    data.message || "حدث خطأ أثناء تعديل الفرصة.",
                    "error"
                );
                return;
            }

            showMessage("تم تعديل الفرصة بنجاح ✅", "success");
            await loadOpportunities();

        } catch (error) {
            console.error(error);
            showMessage("تعذر الاتصال بالسيرفر.", "error");
        } finally {
            button.disabled = false;
            button.textContent = "حفظ التعديلات";
        }
    }

    async function deleteOpportunity(id, button) {
        const confirmed = confirm(
            "هل أنتِ متأكدة من حذف هذه الفرصة؟"
        );

        if (!confirmed) return;

        button.disabled = true;
        button.textContent = "جاري الحذف...";

        try {
            const response = await fetch(`/opportunity/${id}`, {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    companyEmail
                })
            });

            const data = await response.json();

            if (!response.ok) {
                showMessage(
                    data.message || "حدث خطأ أثناء حذف الفرصة.",
                    "error"
                );
                return;
            }

            showMessage("تم حذف الفرصة بنجاح ✅", "success");
            await loadOpportunities();

        } catch (error) {
            console.error(error);
            showMessage("تعذر الاتصال بالسيرفر.", "error");
        } finally {
            button.disabled = false;
            button.textContent = "حذف الفرصة";
        }
    }

    function showMessage(text, type) {
        clearTimeout(messageTimer);

        message.textContent = text;
        message.className = `message ${type}`;

        messageTimer = setTimeout(() => {
            message.textContent = "";
            message.className = "message";
        }, 4000);
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
