<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل طالب | من الجامعة إلى المصنع</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #071426;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #0d1d33;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #d4af37;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #ddd;
            font-size: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #eee;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #33445c;
            border-radius: 10px;
            background: #071426;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #d4af37;
            color: #071426;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e3c45b;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            min-height: 22px;
            font-size: 14px;
        }

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            color: #d4af37;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #bbb;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>FROM UNIVERSITY TO FACTORY</h1>
            <p>من الجامعة إلى المصنع</p>
        </div>

        <h2>إنشاء حساب طالب</h2>

        <form id="registerForm">

            <div class="input-group">
                <label for="name">اسم الطالب</label>
                <input
                    type="text"
                    id="name"
                    placeholder="أدخل اسمك"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="field">التخصص</label>
                <input
                    type="text"
                    id="field"
                    placeholder="مثال: الإلكترونيات"
                    required
                >
            </div>

            <div class="input-group">
                <label for="skills">المهارات</label>
                <input
                    type="text"
                    id="skills"
                    placeholder="مثال: Arduino, Electronics"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >
            </div>

            <button type="submit">إنشاء الحساب</button>

        </form>

        <div class="message" id="message"></div>

        <div class="links">
            <a href="./Login.html">
                لديك حساب بالفعل؟ تسجيل الدخول
            </a>
        </div>

        <a class="back" href="../index.html">
            العودة للصفحة الرئيسية
        </a>

    </div>

    <script>

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (e) {

            e.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const field =
                document.getElementById("field").value.trim();

            const skills =
                document.getElementById("skills").value.trim();

            const password =
                document.getElementById("password").value;

            message.textContent =
                "جاري إنشاء الحساب...";

            message.style.color = "#d4af37";

            try {

                const response = await fetch("/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        field,
                        skills,
                        password
                    })

                });

                const data = await response.json();

                if (response.ok) {

                    localStorage.setItem(
                        "userEmail",
                        data.email || email
                    );

                    message.textContent =
                        data.message || "تم إنشاء الحساب بنجاح";

                    message.style.color = "#4ade80";

                    setTimeout(() => {

                        window.location.href =
                            "./Student-dashboard.html";

                    }, 1000);

                } else {

                    message.textContent =
                        data.message ||
                        "حدث خطأ أثناء إنشاء الحساب";

                    message.style.color = "#ff6b6b";

                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "تعذر الاتصال بالسيرفر";

                message.style.color = "#ff6b6b";

            }

        });

    </script>

</body>
</html>
