<body>

<header>
    <div class="logo">
        LINKORA
        <span>من الجامعة إلى سوق العمل</span>
    </div>

    <a href="./Company-dashboard.html" class="back">لوحة التحكم ←</a>
</header>

<main class="container">

    <section class="page-intro">
        <h1>إضافة فرصة جديدة</h1>
        <p>
            شارك فرص التدريب والعمل مع الطلاب والخريجين،
            وساعدهم في اكتساب الخبرة والاستعداد لسوق العمل.
        </p>
    </section>

    <section class="box">

        <h2 class="section-title">بيانات الفرصة</h2>

        <form id="opportunityForm">

            <label for="title">عنوان الفرصة</label>
            <input
                type="text"
                id="title"
                placeholder="مثال: تدريب عملي في الإلكترونيات"
                required
            >

            <div class="row">
                <div>
                    <label for="type">نوع الفرصة</label>
                    <select id="type" required>
                        <option value="">اختر نوع الفرصة</option>
                        <option value="تدريب">تدريب</option>
                        <option value="وظيفة">وظيفة</option>
                        <option value="تدريب صيفي">تدريب صيفي</option>
                    </select>
                </div>

                <div>
                    <label for="field">المجال</label>
                    <input
                        type="text"
                        id="field"
                        placeholder="مثال: الإلكترونيات"
                        required
                    >
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="location">موقع الفرصة</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="مثال: سوهاج"
                        required
                    >
                </div>

                <div>
                    <label for="deadline">آخر موعد للتقديم</label>
                    <input
                        type="date"
                        id="deadline"
                        required
                    >
                </div>
            </div>

            <label for="description">وصف الفرصة</label>
            <textarea
                id="description"
                placeholder="اكتب تفاصيل التدريب أو الوظيفة والمسؤوليات المتوقعة..."
                required
            ></textarea>

            <label for="skills">المهارات المطلوبة</label>
            <input
                type="text"
                id="skills"
                placeholder="مثال: Arduino, Electronics, C++"
                required
            >
            <span class="hint">افصل بين المهارات باستخدام الفاصلة.</span>

            <button type="submit" id="submitButton">
                نشر الفرصة
            </button>

            <div id="message" role="status" aria-live="polite"></div>

        </form>

    </section>
</main>

<footer>
    LINKORA © من الجامعة إلى سوق العمل
</footer>

<script>
    const form = document.getElementById("opportunityForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const companyEmail = localStorage.getItem("companyEmail");
        const factoryEmail = localStorage.getItem("factoryEmail");

        // الاحتفاظ بدعم حسابات الشركات والمصانع
        const accountEmail = companyEmail || factoryEmail;

        if (!accountEmail) {
            message.textContent =
                "سجّلي الدخول بحساب الشركة أو المصنع أولًا.";
            message.className = "error";
            return;
        }

        const opportunity = {
            companyEmail: accountEmail,
            title: document.getElementById("title").value.trim(),
            type: document.getElementById("type").value,
            field: document.getElementById("field").value.trim(),
            location: document.getElementById("location").value.trim(),
            description: document.getElementById("description").value.trim(),
            skills: document.getElementById("skills").value.trim(),
            deadline: document.getElementById("deadline").value
        };

        if (opportunity.deadline < new Date().toLocaleDateString("en-CA")) {
            message.textContent =
                "اختاري تاريخًا اليوم أو في المستقبل لآخر موعد للتقديم.";
            message.className = "error";
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "جارٍ نشر الفرصة...";
        message.textContent = "";
        message.className = "";

        try {
            const response = await fetch("/opportunities", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(opportunity)
            });

            const data = await response.json();

            if (!response.ok) {
                message.textContent =
                    data.message || "حدث خطأ أثناء إضافة الفرصة.";
                message.className = "error";
                return;
            }

            message.textContent = "تم نشر الفرصة بنجاح ✅";
            message.className = "success";
            form.reset();

        } catch (error) {
            console.error(error);
            message.textContent = "تعذر الاتصال بالسيرفر.";
            message.className = "error";

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "نشر الفرصة";
        }
    });
</script>

</body>
</html>
