
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المصنع | LINKORA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #F1F8FC, #DCEFFA);
            color: #123B5D;
        }

        nav {
            background: #123B5D;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #70C5E8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-size: 14px;
        }

        .container {
            width: min(950px, 92%);
            margin: 55px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 45px #123b5d18;
        }

        .welcome {
            background: linear-gradient(145deg, #123B5D, #1769AA);
            color: white;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .factory-image {
            width: 100%;
            height: 240px;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #70C5E8;
            background: #DCEFFA;
        }

        .factory-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .welcome h1 {
            font-size: 28px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #DCEFFA;
            line-height: 2;
            font-size: 15px;
        }

        .tag {
            margin-top: 25px;
            color: #A7D8F0;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .form-box {
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-box h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #52697A;
            line-height: 1.9;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D5E5EF;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #FAFCFE;
            color: #123B5D;
        }

        input:focus {
            border-color: #1769AA;
            box-shadow: 0 0 0 3px #70C5E822;
        }

        button {
            width: 100%;
            border: none;
            background: #1769AA;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #123B5D;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.8;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            color: #52697A;
            font-size: 14px;
            line-height: 2.4;
        }

        .links a {
            color: #1769AA;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
                margin: 25px auto;
            }

            .welcome {
                padding: 28px 24px;
            }

            .factory-image {
                height: 200px;
            }

            .welcome h1 {
                font-size: 24px;
            }

            .form-box {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">LINK<span>ORA</span></div>
    <div>
        <a href="../index.html">الرئيسية</a>
        <a href="./Factory-register.html">تسجيل مصنع جديد</a>
    </div>
</nav>

<main class="container">

    <section class="welcome">

        <div class="factory-image">
            <img
                src="https://images.unsplash.com/photo-1567789884554-0b844b597180?auto=format&fit=crop&w=900&q=80"
                alt="بيئة صناعية حديثة"
            >
        </div>

        <h1>أهلًا بعودتك إلى LINKORA</h1>

        <p>
            سجّل دخولك لإدارة حساب مصنعك، ومتابعة فرص التدريب والعمل،
            والتواصل مع الطلاب والخريجين.
        </p>

        <div class="tag">LINKORA | UNIVERSITY TO INDUSTRY</div>

    </section>

    <section class="form-box">

        <h2>تسجيل دخول المصنع</h2>
        <p class="subtitle">
            أدخل بريدك الإلكتروني وكلمة المرور للمتابعة.
        </p>

        <form id="factoryLoginForm">

            <div class="field">
                <label for="email">البريد الإلكتروني</label>
                <input
                    id="email"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">كلمة المرور</label>
                <input
                    id="password"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="loginButton" type="submit">
                تسجيل الدخول
            </button>

            <div id="message" class="message" role="status"></div>

        </form>

        <div class="links">
            معندكش حساب مصنع؟
            <a href="./Factory-register.html">أنشئ حساب جديد</a>
            <br>
            <a href="./Login.html">تسجيل دخول الطلاب</a>
        </div>

    </section>

</main>

<script>
    const form = document.getElementById("factoryLoginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        message.style.display = "none";
        loginButton.disabled = true;
        loginButton.textContent = "جارٍ تسجيل الدخول...";

        const data = {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch("/factory-login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.message || "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                );
            }

            localStorage.setItem("factoryEmail", result.factory.email);

            message.textContent =
                result.message || "تم تسجيل الدخول بنجاح.";

            message.style.display = "block";
            message.style.background = "#E5F7EC";
            message.style.color = "#176B3A";

            loginButton.textContent = "تم تسجيل الدخول";

            setTimeout(function () {
                window.location.href = "./Factory-dashboard.html";
            }, 800);

        } catch (error) {
            message.textContent =
                error.message === "Failed to fetch"
                    ? "تعذّر الاتصال بالسيرفر. تأكد إنه شغال."
                    : error.message;

            message.style.display = "block";
            message.style.background = "#FDECEC";
            message.style.color = "#A52626";

            loginButton.disabled = false;
            loginButton.textContent = "تسجيل الدخول";
        }
    });
</script>

</body>
</html>
