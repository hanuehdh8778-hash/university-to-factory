
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الفرصة | LINKORA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #1769AA;
            --sky: #70C5E8;
            --baby: #A7D8F0;
            --light: #F1F8FC;
            --navy: #123B5D;
            --text: #52697A;
            --white: #FFFFFF;
            --border: #DCECF5;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: var(--light);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--white);
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 3px 15px rgba(18, 59, 93, 0.04);
        }

        .logo-en {
            color: var(--blue);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            direction: ltr;
        }

        .logo-ar {
            color: var(--text);
            font-size: 13px;
            margin-top: 5px;
        }

        nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--navy);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        nav a:hover {
            color: var(--blue);
        }

        .page {
            width: min(950px, 90%);
            margin: 55px auto;
            flex: 1;
        }

        .title-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .title-area .label {
            display: inline-block;
            color: var(--blue);
            background: #E4F3FB;
            border: 1px solid #CDE9F7;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            direction: ltr;
        }

        .title-area h1 {
            font-size: 36px;
            line-height: 1.5;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .title-area p {
            color: var(--text);
            line-height: 1.8;
        }

        .details-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(18, 59, 93, 0.07);
        }

        .type {
            display: inline-block;
            background: #E4F3FB;
            color: var(--blue);
            border: 1px solid #CDE9F7;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .description-heading {
            font-size: 20px;
            margin-bottom: 12px;
            color: var(--navy);
        }

        .description {
            color: var(--text);
            line-height: 2;
            font-size: 16px;
            margin-bottom: 30px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .section-heading {
            font-size: 20px;
            margin-bottom: 18px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-box {
            background: #F8FBFD;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 19px;
            min-width: 0;
        }

        .info-box strong {
            display: block;
            color: var(--blue);
            margin-bottom: 9px;
            font-size: 14px;
        }

        .info-box span {
            color: var(--text);
            line-height: 1.8;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .buttons {
            display: flex;
            gap: 14px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }

        .apply {
            background: var(--blue);
            color: var(--white);
            border: 1px solid var(--blue);
        }

        .apply:hover {
            background: var(--navy);
            border-color: var(--navy);
            transform: translateY(-2px);
        }

        .back {
            background: var(--white);
            border: 1px solid var(--blue);
            color: var(--blue);
        }

        .back:hover {
            background: #EAF5FC;
            transform: translateY(-2px);
        }

        .message {
            text-align: center;
            color: var(--text);
            padding: 65px 20px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            line-height: 2;
        }

        .message-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E4F3FB;
            color: var(--blue);
            border-radius: 18px;
            font-size: 27px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--text);
            background: var(--white);
            border-top: 1px solid var(--border);
            font-size: 13px;
            line-height: 1.8;
        }

        footer span {
            color: var(--blue);
            font-weight: bold;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 18px;
                padding: 18px 5%;
            }

            .logo-ar {
                text-align: center;
            }

            nav {
                gap: 16px;
                justify-content: center;
            }

            .page {
                margin: 30px auto;
            }

            .title-area h1 {
                font-size: 28px;
            }

            .details-card {
                padding: 22px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <div class="logo-en">LINKORA</div>
            <div class="logo-ar">من الجامعة إلى سوق العمل</div>
        </div>

        <nav>
            <a href="../index.html">الرئيسية</a>
            <a href="./Opportunities.html">الفرص</a>
            <a href="./Company-register.html">الشركات</a>
            <a href="./Login.html">تسجيل الدخول</a>
        </nav>
    </header>

    <main class="page">
        <div id="content">
            <div class="message">
                <div class="message-icon">↻</div>
                جاري تحميل تفاصيل الفرصة...
            </div>
        </div>
    </main>

    <footer>
        © 2026 <span>LINKORA</span> — من الجامعة إلى سوق العمل
        <br>
        جميع الحقوق محفوظة
    </footer>

    <script>
        const content = document.getElementById("content");

        const params = new URLSearchParams(window.location.search);
        const opportunityId = params.get("id");

        function showMessage(text) {
            content.replaceChildren();

            const box = document.createElement("div");
            box.className = "message";

            const icon = document.createElement("div");
            icon.className = "message-icon";
            icon.textContent = "!";

            const textElement = document.createElement("p");
            textElement.textContent = text;

            box.append(icon, textElement);
            content.appendChild(box);
        }

        function createInfoBox(label, value) {
            const box = document.createElement("div");
            box.className = "info-box";

            const title = document.createElement("strong");
            title.textContent = label;

            const text = document.createElement("span");
            text.textContent = value || "غير محدد";

            box.append(title, text);
            return box;
        }

        async function loadOpportunity() {
            if (!opportunityId || !/^\d+$/.test(opportunityId)) {
                showMessage("لم يتم تحديد فرصة صحيحة.");
                return;
            }

            try {
                const response = await fetch(
                    `/opportunity?id=${encodeURIComponent(opportunityId)}`
                );

                if (!response.ok) {
                    throw new Error("تعذر العثور على الفرصة.");
                }

                const result = await response.json();

                const opportunity = result.opportunity || result;

                if (!opportunity || !opportunity.id) {
                    showMessage("الفرصة غير موجودة حاليًا.");
                    return;
                }

                content.replaceChildren();

                const titleArea = document.createElement("div");
                titleArea.className = "title-area";

                const label = document.createElement("div");
                label.className = "label";
                label.textContent = "OPPORTUNITY DETAILS";

                const title = document.createElement("h1");
                title.textContent = opportunity.title || "فرصة تدريب أو عمل";

                const subtitle = document.createElement("p");
                subtitle.textContent = "كل التفاصيل التي تحتاجين معرفتها قبل التقديم.";

                titleArea.append(label, title, subtitle);

                const card = document.createElement("section");
                card.className = "details-card";

                const type = document.createElement("span");
                type.className = "type";
                type.textContent = opportunity.type || "فرصة";

                const descriptionHeading = document.createElement("h2");
                descriptionHeading.className = "description-heading";
                descriptionHeading.textContent = "نبذة عن الفرصة";

                const description = document.createElement("p");
                description.className = "description";
                description.textContent =
                    opportunity.description || "لا يوجد وصف لهذه الفرصة حاليًا.";

                const sectionHeading = document.createElement("h2");
                sectionHeading.className = "section-heading";
                sectionHeading.textContent = "معلومات الفرصة";

                const infoGrid = document.createElement("div");
                infoGrid.className = "info-grid";

                infoGrid.append(
                    createInfoBox("المجال", opportunity.field),
                    createInfoBox("المكان", opportunity.location),
                    createInfoBox("المهارات المطلوبة", opportunity.skills),
                    createInfoBox("آخر موعد للتقديم", opportunity.deadline)
                );

                const buttons = document.createElement("div");
                buttons.className = "buttons";

                const applyButton = document.createElement("a");
                applyButton.className = "btn apply";
                applyButton.href =
                    `./Apply.html?id=${encodeURIComponent(opportunity.id)}&name=${encodeURIComponent(opportunity.title || "")}`;
                applyButton.textContent = "التقديم على الفرصة";

                const backButton = document.createElement("a");
                backButton.className = "btn back";
                backButton.href = "./Opportunities.html";
                backButton.textContent = "العودة إلى الفرص";

                buttons.append(applyButton, backButton);

                card.append(
                    type,
                    descriptionHeading,
                    description,
                    sectionHeading,
                    infoGrid,
                    buttons
                );

                content.append(titleArea, card);

            } catch (error) {
                console.error(error);
                showMessage(
                    "حدث خطأ أثناء تحميل تفاصيل الفرصة. حاولي مرة أخرى لاحقًا."
                );
            }
        }

        loadOpportunity();
    </script>

</body>
</html>
