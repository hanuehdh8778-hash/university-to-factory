<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الشركة | LINKORA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        :root {
            --blue: #1769AA;

</head>

<body>

    <main class="container">

        <div class="logo">
            <div class="logo-icon">L</div>
            <h1>LINKORA</h1>
            <p>من الجامعة إلى سوق العمل</p>
        </div>

        <h2>أهلًا بعودتك!</h2>
        <p class="subtitle">
            سجّلي الدخول إلى حساب شركتك لإدارة الفرص والتواصل مع الطلاب.
        </p>

        <form id="companyLoginForm">

            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="email"
                    placeholder="أدخلي البريد الإلكتروني"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input
                    type="password"
                    id="password"
                    placeholder="أدخلي كلمة المرور"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                تسجيل الدخول
            </button>

        </form>

        <div class="message" id="message" role="status" aria-live="polite"></div>

        <div class="links">
            ليس لديك حساب؟
            <a href="./Company-register.html">إنشاء حساب شركة</a>
        </div>

        <a class="back" href="../index.html">
            ← العودة للصفحة الرئيسية
        </a>

    </main>

    <script>
        const form = document.getElementById("companyLoginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "جاري تسجيل الدخول...";
            message.style.color = "#1769AA";
            loginButton.disabled = true;

            try {
                const response = await fetch("/company-login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem(
                        "companyEmail",
                        data.email || email
                    );

                    message.textContent =
                        data.message || "تم تسجيل الدخول بنجاح";

                    message.style.color = "#16804A";

                    setTimeout(() => {
                        window.location.href =
                            "./Company-dashboard.html";
                    }, 1000);

                } else {
                    message.textContent =
                        data.message ||
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة";

                    message.style.color = "#D93636";
                    loginButton.disabled = false;
                }

            } catch (error) {
                console.error(error);

                message.textContent = "تعذر الاتصال بالسيرفر، حاولي مرة أخرى.";
                message.style.color = "#D93636";
                loginButton.disabled = false;
            }
        });
    </script>

</body>
</html>
