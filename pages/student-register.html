
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل طالب | من الجامعة إلى المصنع</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #071426;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #0d1d33;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #d4af37;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #ddd;
            font-size: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #eee;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #33445c;
            border-radius: 10px;
            background: #071426;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #d4af37;
        }

        select option {
            background: #071426;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #d4af37;
            color: #071426;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e3c45b;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            min-height: 22px;
            font-size: 14px;
        }

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links a {
            color: #d4af37;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #bbb;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">

            <h1>
                FROM UNIVERSITY TO FACTORY
            </h1>

            <p>
                من الجامعة إلى المصنع
            </p>

        </div>

        <h2>
            تسجيل طالب 🎓
        </h2>

        <form id="studentRegisterForm">

            <div class="input-group">

                <label for="name">
                    الاسم بالكامل
                </label>

                <input
                    type="text"
                    id="name"
                    required>

            </div>

            <div class="input-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    required>

            </div>

            <div class="input-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    required>

            </div>

            <div class="input-group">

                <label for="college">
                    الكلية
                </label>

                <input
                    type="text"
                    id="college"
                    required>

            </div>

            <div class="input-group">

                <label for="department">
                    القسم / التخصص
                </label>

                <input
                    type="text"
                    id="department"
                    required>

            </div>

            <div class="input-group">

                <label for="study_year">
                    السنة الدراسية
                </label>

                <select
                    id="study_year"
                    required>

                    <option value="">
                        اختر السنة الدراسية
                    </option>

                    <option value="الفرقة الأولى">
                        الفرقة الأولى
                    </option>

                    <option value="الفرقة الثانية">
                        الفرقة الثانية
                    </option>

                    <option value="الفرقة الثالثة">
                        الفرقة الثالثة
                    </option>

                    <option value="الفرقة الرابعة">
                        الفرقة الرابعة
                    </option>

                </select>

            </div>

            <div class="input-group">

                <label for="skills">
                    المهارات
                </label>

                <input
                    type="text"
                    id="skills"
                    placeholder="مثال: Arduino, إلكترونيات"
                    required>

            </div>

            <button type="submit">
                إنشاء حساب الطالب
            </button>

        </form>

        <div
            class="message"
            id="message">
        </div>

        <div class="links">

            <a href="./login.html">
                لدي حساب بالفعل؟ تسجيل الدخول
            </a>

        </div>

        <a
            class="back"
            href="../index.html">

            العودة للصفحة الرئيسية

        </a>

    </div>

    <script>

        const form =
            document.getElementById(
                "studentRegisterForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        form.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                const college =
                    document
                        .getElementById("college")
                        .value
                        .trim();

                const department =
                    document
                        .getElementById("department")
                        .value
                        .trim();

                const study_year =
                    document
                        .getElementById("study_year")
                        .value;

                const skills =
                    document
                        .getElementById("skills")
                        .value
                        .trim();

                message.textContent =
                    "جاري إنشاء الحساب...";

                message.style.color =
                    "#d4af37";

                try {

                    const response =
                        await fetch(
                            "/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name,
                                        email,
                                        password,
                                        college,
                                        department,
                                        study_year,
                                        skills
                                    })
                            }
                        );

                    const data =
                        await response.json();

                    if (response.ok) {

                        message.textContent =
                            data.message ||
                            "تم إنشاء حساب الطالب بنجاح";

                        message.style.color =
                            "#4ade80";

                    } else {

                        message.textContent =
                            data.message ||
                            "حدث خطأ أثناء التسجيل";

                        message.style.color =
                            "#ff6b6b";
                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "تعذر الاتصال بالسيرفر";

                    message.style.color =
                        "#ff6b6b";
                }

            }
        );

    </script>

</body>

</html>
